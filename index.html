<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hamish Bullen</title>
  <link rel="icon" href="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/refs/heads/main/photos/icon.png" type="image/png">
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="parallax">
    <section class="parallax__header">
      <div class="parallax__visuals">
        <div class="parallax__black-line-overflow"></div>
        <div data-parallax-layers class="parallax__layers">
          <img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/refs/heads/main/photos/f1%20photo1.webp" loading="eager" width="800" data-parallax-layer="1" alt="" class="parallax__layer-img">
          <img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/refs/heads/main/photos/f1%20photo1.webp" loading="eager" width="800" data-parallax-layer="2" alt="" class="parallax__layer-img">

          <div data-parallax-layer="3" class="parallax__layer-title">
            <h4 class="parallax__title">Hamish Bullen</h4>
          </div>

          <!-- LOGO SCROLLER -->
          <div class="company-banner" data-parallax-layer="3">
            <div class="slider">
              <div class="slide-track">
                <!-- 9 logos with different rotations -->
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(0deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(10deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(20deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(30deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(40deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(50deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(60deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(75deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(90deg);" alt="logo" /></div>

                <!-- Duplicate for seamless infinite effect -->
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(0deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(10deg);" alt="logo" /></div>
                <div class="slide"><img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/main/photos/icon.png" style="transform: rotate(20deg);" alt="logo" /></div>
              </div>
            </div>
          </div>

          <img src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/refs/heads/main/photos/toplayer.webp" loading="eager" width="800" data-parallax-layer="4" alt="" class="parallax__layer-img">
        </div>
        <div class="parallax__fade"></div>
      </div>
    </section>

    <section class="parallax__content">
      <a href="about">
        <img 
          src="https://raw.githubusercontent.com/hamishmedia/hamish.github.io/refs/heads/main/photos/MORE.webp" 
          alt="More" 
          class="parallax__more-img" 
          style="width: 500px; height: auto; display: block; margin: 0 auto;"
        />
      </a>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
